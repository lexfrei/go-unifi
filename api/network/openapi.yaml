          type: integer
          description: Total TX attempts
          example: 250652
        wifi_tx_retries_percentage:
          type: number
          format: float
          description: TX retry percentage
          example: 9.7
        satisfaction:
          type: integer
          description: Satisfaction score (legacy)
        anomalies:
          type: integer
          description: Number of detected anomalies
          example: 0
        # Traffic statistics
        rx_bytes:
          type: integer
          format: int64
          description: Total received bytes
          example: 1029984838
        tx_bytes:
          type: integer
          format: int64
          description: Total transmitted bytes
          example: 472635464
        rx_bytes-r:
          type: integer
          description: Recent received bytes rate
          example: 430
        tx_bytes-r:
          type: integer
          description: Recent transmitted bytes rate
          example: 1651
        rx_packets:
          type: integer
          format: int64
          description: Total received packets
          example: 1035276
        tx_packets:
          type: integer
          format: int64
          description: Total transmitted packets
          example: 713482
        rx_rate:
          type: integer
          description: RX rate in Kbps
          example: 720600
        tx_rate:
          type: integer
          description: TX rate in Kbps
          example: 720600
        tx_mcs_index:
          type: integer
          description: TX MCS index (-1 if N/A)
          example: -1
        rate_imbalance:
          type: integer
          description: Rate imbalance indicator
          example: 0
        # Timestamps
        first_seen:
          type: integer
          format: int64
          description: First seen Unix timestamp
          example: 1755077832
        last_seen:
          type: integer
          format: int64
          description: Last seen Unix timestamp
          example: 1764072754
        assoc_time:
          type: integer
          format: int64
          description: Association time Unix timestamp
          example: 1763914030
        latest_assoc_time:
          type: integer
          format: int64
          description: Latest association Unix timestamp
          example: 1764072754
        dhcpend_time:
          type: integer
          description: DHCP lease end time (0 if not applicable)
          example: 0
        uptime:
          type: integer
          description: Connection uptime in seconds
          example: 158724
        idletime:
          type: integer
          description: Idle time in seconds
          example: 8
        roam_count:

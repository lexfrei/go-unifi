    # Set SSL ciphers for all recommended and secure ciphers

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-PSK-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:!SHA1:!SHA256:!SHA384:!DSS:!aNULL;
    ssl_protocols TLSv1.2 TLSv1.3;

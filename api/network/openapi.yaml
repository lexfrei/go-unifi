    get:
      summary: Get WiFi AP statistics
      description: |
        Retrieves WiFi statistics for all access points including client counts,
        signal averages, satisfaction scores, and traffic distribution.
        Requires time range parameters.
      operationId: getWiFiStatsAPs
      tags:
        - Analytics
      parameters:
        - $ref: '#/components/parameters/Site'
        - name: interval
          in: query
          required: true
          description: Statistics interval granularity
          schema:
            type: string
            enum:
              - hourly
              - daily
            example: hourly
        - name: start
          in: query
          required: true
          description: Start time in Unix milliseconds
          schema:
            type: integer
            format: int64
            example: 1764000000000
        - name: end
          in: query
          required: true
          description: End time in Unix milliseconds
          schema:
            type: integer
            format: int64
            example: 1764086400000
      responses:
        '200':
          description: Successful response with AP statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WiFiStatsAPsResponse'

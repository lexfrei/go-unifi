# extra scopes when admin has permission: connect.management#admin

# this is for identity management
permission: "connect.management#admin"
# only apply permissions when the unifi-os console support identity
only_if_support_identity: true
scopes:
  - send:identity:email
  - revoke:identity:credential
  - assign:identity:evstation
  - view:identity:assignment_evs
  - view:identity:assignment_light
  - view:identity:assignment_shade
  - view:app:users
  - view:user
  - edit:user
  - view:group
  - edit:group
  - view:identity:settings
  - view:settings

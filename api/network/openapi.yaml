          description: Client identifier (same as MAC)
          example: "36:e9:55:9b:9a:a7"
        mac:
          type: string
          description: MAC address
          example: "36:e9:55:9b:9a:a7"
        ip:
          type: string
          description: IP address
          example: "172.16.10.143"
        hostname:
          type: string
          description: Client hostname
          example: iPhone
        display_name:
          type: string
          description: Display name
          example: "iPhone 9a:a7"
        model_name:
          type: string
          description: Device model name (from fingerprint)
          example: "Apple iPhone 11 Pro"
        oui:
          type: string
          description: Manufacturer from OUI lookup
        status:
          type: string
          description: Connection status
          enum:
            - online
            - offline
          example: online
        type:
          type: string
          description: Connection type
          enum:
            - WIRELESS
            - WIRED
          example: WIRELESS
        is_wired:
          type: boolean
          description: Whether client is wired
          example: false
        is_guest:
          type: boolean
          description: Whether client is on guest network
          example: false
        is_mlo:
          type: boolean
          description: Whether using Multi-Link Operation (WiFi 7)
          example: false
        blocked:
          type: boolean
          description: Whether client is blocked
          example: false
        noted:
          type: boolean
          description: Whether client is noted/starred
          example: false
        # Network identifiers
        network_id:
          type: string
          description: Network ID
          example: "66c784195302e23512334eb4"
        network_name:
          type: string
          description: Network name
          example: Default
        site_id:
          type: string
          description: Site ID
          example: "66c784155302e23512334e9b"
        user_id:
          type: string
          description: User ID
          example: "689c5cc8d46ec26456f433c5"
        usergroup_id:
          type: string
          description: User group ID
        wlanconf_id:
          type: string
          description: WLAN configuration ID
          example: "66c784a65302e23512334ec7"
        network_members_group_ids:
          type: array
          description: Network member group IDs
          items:
            type: string
        # WiFi connection details
        ap_mac:
          type: string
          description: Access point MAC address
          example: "94:2a:6f:ce:26:52"
        bssid:
          type: string
          description: BSSID
          example: "94:2a:6f:ce:26:58"
        essid:
          type: string
          description: SSID name
          example: "f@lex.la"
        channel:
          type: integer
          description: WiFi channel
          example: 44
        channel_width:
          type: string
          description: Channel width
          example: "80"
        radio:
          type: string
          description: Radio band (na=5GHz, ng=2.4GHz)
          example: na
        last_radio:
          type: string
          description: Last used radio band
          example: na
        radio_name:
          type: string
          description: Radio interface name
          example: wifi1
        radio_proto:
          type: string
          description: WiFi protocol
          enum:
            - a
            - b
            - g
            - n
            - ac
            - ax
            - be
          example: ax
        mimo:
          type: string
          description: MIMO configuration
          example: MIMO_2
        # Signal quality
        signal:
          type: integer
          description: Signal strength in dBm
          example: -57
        rssi:
          type: integer
          description: RSSI value
          example: 36
        noise:
          type: integer
          description: Noise floor in dBm
          example: -93
        ccq:
          type: integer
          description: Client Connection Quality (0-1000)
          example: 933
        # WiFi experience
        wifi_experience_score:
          type: integer
          description: Current WiFi experience score (0-100)
          example: 99
        wifi_experience_average:
          type: integer
          description: Average WiFi experience score
          example: 98

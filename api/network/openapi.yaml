      type: object
      description: A system log entry
      properties:
        _id:
          type: string
          description: Log entry ID
          example: "674a8c2f5302e23512d4f123"
        datetime:
          type: string
          format: date-time
          description: Log entry timestamp in ISO 8601 format
          example: "2025-11-25T10:30:00Z"
        time:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds
          example: 1764072600000
        key:
          type: string

# extra scopes when admin has permission: network.management#admin

# this is for identity management
permission: "network.management#readonly"
# only apply permissions when the unifi-os console support identity
only_if_support_identity: true
scopes:
  - view:app:users
  - view:user
  - view:group
  - view:identity:settings
  - view:settings
  - view:identity:assignment_wifi
  - view:identity:assignment_vpn

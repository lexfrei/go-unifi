        key:
          type: string
          description: Alert key
        message:
          type: string
          description: Human-readable message
        message_raw:
          type: string
          description: Raw message template
        severity:
          type: string
          description: Alert severity
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        status:
          type: string
          description: Alert status
          enum:

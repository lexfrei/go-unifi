# extra scopes when admin has permission: protect.management#admin

# this is for identity management
permission: "protect.management#admin"
# only apply permissions when the unifi-os console support identity
only_if_support_identity: true
scopes:
  - send:identity:email
  - revoke:identity:credential
  - assign:identity:camera
  - view:identity:assignment_camera
  - view:app:users
  - view:user
  - edit:user
  - view:group
  - edit:group
  - view:identity:settings
  - view:settings

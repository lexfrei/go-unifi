components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key generated from UniFi controller (Settings > Control Plane > Integrations)

  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      description: |
        The unique identifier of the site in UUID format (Integration API v1).
        This is the `id` field from the site object.
        Use `GET /integration/v1/sites` to get site UUIDs.
      schema:
        type: string
        format: uuid
      example: 88f7af54-98f8-306a-a1c7-c9349722b1f6

    DeviceId:
      name: deviceId
      in: path
      required: true
      description: The unique identifier of the device (UUID format)
      schema:
        type: string
        format: uuid
      example: 71cb254a-b068-39f9-9138-0fbf8fe11cac

    ClientId:
      name: clientId
      in: path
      required: true
      description: The unique identifier of the client (UUID format)
      schema:
        type: string
        format: uuid
      example: f95a0eb4-ddf9-3f41-942c-1793ac30d4c9

    Offset:
      name: offset
      in: query
      description: Number of items to skip before starting to return results (for pagination)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25

    Site:
      name: site
      in: path
      required: true
      description: |
        The site internal reference string (DNS API v2).
        This is the `internalReference` field from the site object.
        **Important**: DNS API does NOT accept UUIDs - use internal reference only.
        Common value: `default`
        Use `GET /integration/v1/sites` to get site internal references.
      schema:
        type: string
      example: default

    RecordId:
      name: recordId
      in: path
      required: true
      description: The unique identifier of the DNS record
      schema:
        type: string
      example: 68e04e991056cd46ea9edcd4

    PolicyId:
      name: policyId
      in: path
      required: true
      description: The unique identifier of the firewall policy
      schema:
        type: string
      example: 68a496708e604379be63f81368a496708e604379be63f8132147483647

    RuleId:
      name: ruleId
      in: path
      required: true
      description: The unique identifier of the traffic rule
      schema:
        type: string
      example: 507f1f77bcf86cd799439011

    ClientMac:
      name: clientMac
      in: path
      required: true
      description: |
        The MAC address of the client device.
        Format: colon-separated hex pairs (e.g., 36:e9:55:9b:9a:a7)
      schema:
        type: string
        pattern: '^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$'
      example: "36:e9:55:9b:9a:a7"

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            statusName: UNAUTHORIZED
            message: Invalid API key
            timestamp: "2025-11-11T16:00:00Z"
            requestPath: /integration/v1/sites

    NotFound:
      description: Not Found - Resource or endpoint does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            statusName: NOT_FOUND
            message: "No endpoint GET /integration/v1/sites/invalid-id"
            timestamp: "2025-11-11T16:00:00Z"
            requestPath: /integration/v1/sites/invalid-id

    BadRequest:
      description: Bad Request - Invalid or malformed request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            statusName: BAD_REQUEST
            message: "Invalid request: count must be between 1 and 1000"
            timestamp: "2025-11-11T16:00:00Z"
            requestPath: /integration/v1/sites/88f7af54-98f8-306a-a1c7-c9349722b1f6/hotspot/vouchers

  schemas:
    # Base response types
    PaginatedResponse:
      type: object
      required:
        - offset
        - limit
        - count
        - totalCount
        - data
      properties:
        offset:
          type: integer
          description: Number of items skipped
          example: 0
        limit:
          type: integer
          description: Maximum number of items per page
          example: 25
        count:
          type: integer
          description: Number of items in current response
          example: 1
        totalCount:
          type: integer
          description: Total number of items available
          example: 1

    ErrorResponse:
      type: object
      required:
        - statusCode
        - statusName
        - message
        - timestamp
        - requestPath
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 404
        statusName:
          type: string
          description: HTTP status name
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error message
          example: "No endpoint GET /integration/v1/sites/invalid-id"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred (RFC3339 format)
          example: "2025-11-11T16:00:00Z"
        requestPath:
          type: string
          description: The request path that caused the error
          example: /integration/v1/sites/invalid-id

    # Sites
    SitesResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SiteListItem'

    SiteListItem:
      type: object
      required:
        - id
        - internalReference
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the site
          example: 88f7af54-98f8-306a-a1c7-c9349722b1f6
        internalReference:
          type: string
          description: Internal reference name used in UniFi controller URLs
          example: default
        name:
          type: string
          description: Display name of the site
          example: Default

    # Devices
    DevicesResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceListItem'

    DeviceListItem:
      type: object
      required:
        - id
        - name
        - model
        - macAddress
        - ipAddress
        - state
        - features
        - interfaces
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the device
          example: 71cb254a-b068-39f9-9138-0fbf8fe11cac
        name:
          type: string
          description: Display name of the device
          example: My Network Device
        model:
          type: string
          description: Device model identifier
          example: UDR7
        macAddress:
          type: string
          description: MAC address of the device
          example: "94:2a:6f:ce:26:52"
        ipAddress:
          type: string
          description: IP address of the device
          example: 192.168.1.1
        state:
          type: string
          description: Current operational state
          enum:
            - ONLINE
            - OFFLINE
            - UPGRADING
            - PROVISIONING
          example: ONLINE
        features:
          type: array
          description: List of features supported by this device
          items:
            type: string
            enum:
              - switching
              - accessPoint
              - routing
              - gateway
          example:
            - switching
            - accessPoint
        interfaces:
          type: array
          description: Types of network interfaces available
          items:
            type: string
            enum:
              - ports
              - radios
              - wan
          example:
            - ports
            - radios

    Device:
      type: object
      required:
        - id
        - name
        - model
        - supported
        - macAddress
        - ipAddress
        - state
        - firmwareVersion
        - firmwareUpdatable
        - provisionedAt
        - configurationId
        - features
        - interfaces
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the device
          example: 71cb254a-b068-39f9-9138-0fbf8fe11cac
        name:
          type: string
          description: Display name of the device
          example: My Network Device
        model:
          type: string
          description: Device model identifier
          example: UDR7
        supported:
          type: boolean
          description: Whether this device is officially supported
          example: true
        macAddress:
          type: string
          description: MAC address of the device
          example: "94:2a:6f:ce:26:52"
        ipAddress:
          type: string
          description: IP address of the device
          example: 192.168.1.1
        state:
          type: string
          description: Current operational state
          enum:
            - ONLINE
            - OFFLINE
            - UPGRADING
            - PROVISIONING
          example: ONLINE
        firmwareVersion:
          type: string
          description: Current firmware version
          example: 4.3.9
        firmwareUpdatable:
          type: boolean
          description: Whether firmware update is available
          example: false
        provisionedAt:
          type: string
          format: date-time
          description: Timestamp when device was provisioned (RFC3339 format)
          example: "2025-11-03T21:41:04Z"
        configurationId:
          type: string
          description: Current configuration identifier
          example: c212be130585ee93
        features:
          type: object
          description: Feature-specific configuration and capabilities
          additionalProperties:
            type: object
          example:
            switching: {}
            accessPoint: {}
        interfaces:
          $ref: '#/components/schemas/DeviceInterfaces'

    DeviceInterfaces:
      type: object
      description: Network interfaces available on the device
      properties:
        ports:
          type: array
          description: Physical ethernet ports
          items:
            $ref: '#/components/schemas/Port'
        radios:
          type: array
          description: Wireless radio interfaces
          items:
            $ref: '#/components/schemas/Radio'

    Port:
      type: object
      required:
        - idx
        - state
        - connector
        - maxSpeedMbps
        - speedMbps
      properties:
        idx:
          type: integer
          description: Port index number (1-based)
          example: 1
        state:
          type: string
          description: Current port state
          enum:
            - UP
            - DOWN
          example: UP
        connector:
          type: string
          description: Physical connector type
          enum:
            - RJ45
            - SFPPLUS
            - SFP
          example: RJ45
        maxSpeedMbps:
          type: integer
          description: Maximum supported speed in Mbps
          example: 2500
        speedMbps:
          type: integer
          description: Current negotiated speed in Mbps
          example: 1000
        poe:
          $ref: '#/components/schemas/PoE'

    PoE:
      type: object
      description: Power over Ethernet configuration and status
      required:
        - standard
        - type
        - enabled
        - state
      properties:
        standard:
          type: string
          description: PoE standard supported
          enum:
            - 802.3af
            - 802.3at
            - 802.3bt
          example: 802.3af
        type:
          type: integer
          description: PoE type number
          example: 1
        enabled:
          type: boolean
          description: Whether PoE is enabled on this port
          example: true
        state:
          type: string
          description: Current PoE state
          enum:
            - UP
            - DOWN
            - DISABLED
          example: UP

    Radio:
      type: object
      required:
        - wlanStandard
        - frequencyGHz
        - channelWidthMHz
        - channel
      properties:
        wlanStandard:
          type: string
          description: WiFi standard supported
          enum:
            - 802.11a
            - 802.11b
            - 802.11g
            - 802.11n
            - 802.11ac
            - 802.11ax
            - 802.11be
          example: 802.11be
        frequencyGHz:
          type: number
          format: float
          description: Operating frequency in GHz
          enum:
            - 2.4
            - 5
            - 6
          example: 2.4
        channelWidthMHz:
          type: integer
          description: Channel width in MHz
          enum:
            - 20
            - 40
            - 80
            - 160
          example: 20
        channel:
          type: integer
          description: WiFi channel number
          example: 6

    # Clients
    ClientsResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ClientListItem'

    ClientListItem:
      type: object
      required:
        - type
        - id
        - name
        - connectedAt
        - ipAddress
        - macAddress
        - uplinkDeviceId
        - access
      properties:
        type:
          type: string
          description: Connection type
          enum:
            - WIRED
            - WIRELESS
          example: WIRED
        id:
          type: string
          format: uuid
          description: Unique identifier for the client
          example: f95a0eb4-ddf9-3f41-942c-1793ac30d4c9
        name:
          type: string
          description: Display name or hostname of the client
          example: server-01
        connectedAt:
          type: string
          format: date-time
          description: Timestamp when client connected (RFC3339 format)
          example: "2025-10-19T10:09:31Z"
        ipAddress:
          type: string
          description: IP address assigned to the client
          example: 192.168.1.100
        macAddress:
          type: string
          description: MAC address of the client
          example: "00:11:22:33:44:55"
        uplinkDeviceId:
          type: string
          format: uuid
          description: ID of the device this client is connected to
          example: 71cb254a-b068-39f9-9138-0fbf8fe11cac
        access:
          $ref: '#/components/schemas/ClientAccess'

    NetworkClient:
      allOf:
        - $ref: '#/components/schemas/ClientListItem'

    ClientAccess:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Access control type
          enum:
            - DEFAULT
            - RESTRICTED
            - BLOCKED
          example: DEFAULT

    # Hotspot Vouchers
    HotspotVouchersResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/HotspotVoucher'

    HotspotVoucher:
      type: object
      required:
        - _id
        - code
        - create_time
      properties:
        _id:
          type: string
          format: uuid
          description: Unique identifier for the voucher
          example: 68e04e991056cd46ea9edcd4
        code:
          type: string
          description: The voucher code that guests use to access the network
          example: 12345-67890
        duration:
          type: integer
          description: Validity period in minutes (0 = unlimited)
          example: 480
        quota:
          type: integer
          description: Maximum number of times the voucher can be used (0 = unlimited)
          example: 1
        note:
          type: string
          description: Optional note or description for the voucher
          example: Guest WiFi for conference room A
        create_time:
          type: integer
          description: Unix timestamp when voucher was created
          example: 1709654400
        used:
          type: integer
          description: Number of times the voucher has been used
          example: 0
        status:
          type: string
          description: Current status of the voucher
          enum:
            - VALID_ONE
            - VALID_MULTI
            - USED
            - EXPIRED
          example: VALID_ONE
        qos_overwrite:
          type: boolean
          description: Whether custom bandwidth limits are applied
          example: true
        qos_rate_max_down:
          type: integer
          description: Maximum download speed in Kbps (0 = unlimited)
          example: 10000
        qos_rate_max_up:
          type: integer
          description: Maximum upload speed in Kbps (0 = unlimited)
          example: 5000
        site_id:
          type: string
          format: uuid
          description: The site this voucher belongs to
          example: 88f7af54-98f8-306a-a1c7-c9349722b1f6

    CreateVouchersRequest:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of vouchers to create
          minimum: 1
          maximum: 1000
          example: 10
        duration:
          type: integer
          description: Validity period in minutes (default = 1440, 0 = unlimited)
          minimum: 0
          example: 480
        quota:
          type: integer
          description: Maximum uses per voucher (default = 1, 0 = unlimited)
          minimum: 0
          example: 1
        note:
          type: string
          description: Optional note for all created vouchers
          example: Conference guest WiFi
        qos_overwrite:
          type: boolean
          description: Whether to apply custom bandwidth limits
          example: true
        qos_rate_max_down:
          type: integer
          description: Maximum download speed in Kbps (0 = unlimited)
          minimum: 0
          example: 10000
        qos_rate_max_up:
          type: integer
          description: Maximum upload speed in Kbps (0 = unlimited)
          minimum: 0
          example: 5000
        up:
          type: integer
          description: Upload bandwidth limit in Kbps (legacy, use qos_rate_max_up)
          minimum: 0
          example: 5000
        down:
          type: integer
          description: Download bandwidth limit in Kbps (legacy, use qos_rate_max_down)
          minimum: 0
          example: 10000
        bytes:
          type: integer
          description: Total data quota in MB (0 = unlimited)
          minimum: 0
          example: 1024

    # DNS Records
    DNSRecord:
      type: object
      required:
        - _id
        - enabled
        - key
        - record_type
        - value
      properties:
        _id:
          type: string
          description: Unique identifier for the DNS record
          example: 68e04e991056cd46ea9edcd4
        enabled:
          type: boolean
          description: Whether the DNS record is enabled
          example: true
        key:
          type: string
          description: DNS record name (hostname or domain)
          example: "*.example.local"
        record_type:
          type: string
          description: DNS record type
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - NS
            - SRV
            - TXT
          example: A
        value:
          type: string
          description: DNS record value (IP address, target hostname, etc.)
          example: 192.168.1.100
        ttl:
          type: integer
          description: Time to live in seconds (0 = default)
          default: 0
          example: 0
        priority:
          type: integer
          description: Priority for MX and SRV records
          example: 0
        weight:
          type: integer
          description: Weight for SRV records
          example: 0
        port:
          type: integer
          description: Port number for SRV records
          example: 0

    DNSRecordInput:
      type: object
      required:
        - key
        - record_type
        - value
      properties:
        enabled:
          type: boolean
          description: Whether the DNS record should be enabled
          default: true
          example: true
        key:
          type: string
          description: DNS record name (hostname or domain)
          example: "api.example.com"
        record_type:
          type: string
          description: DNS record type
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - NS
            - SRV
            - TXT
          example: A
        value:
          type: string
          description: DNS record value (IP address, target hostname, etc.)
          example: 192.168.1.100
        ttl:
          type: integer
          description: Time to live in seconds (0 = default)
          default: 0
          example: 0
        priority:
          type: integer
          description: Priority for MX and SRV records
          example: 10
        weight:
          type: integer
          description: Weight for SRV records
          example: 5
        port:
          type: integer
          description: Port number for SRV records
          example: 443

    # Firewall Policies
    FirewallPolicy:
      type: object
      required:
        - _id
        - action
        - enabled
        - name
      properties:
        _id:
          type: string
          description: Unique identifier for the firewall policy
          example: 68a496708e604379be63f81368a496708e604379be63f8132147483647
        action:
          type: string
          description: Action to take when traffic matches this policy
          enum:
            - ALLOW
            - DROP
            - REJECT
          example: ALLOW
        enabled:
          type: boolean
          description: Whether the policy is enabled
          example: true
        name:
          type: string
          description: Name of the firewall policy
          example: Allow All Traffic
        predefined:
          type: boolean
          description: Whether this is a predefined system policy (cannot be modified)
          example: true
        index:
          type: integer
          description: Priority index of the policy
          example: 2147483647
        protocol:
          type: string
          description: Protocol to match
          example: all
        logging:
          type: boolean
          description: Whether to log matching traffic
          example: false
        ip_version:
          type: string
          description: IP version to match
          enum:
            - IPV4
            - IPV6
            - BOTH
          example: BOTH
        source:
          type: object
          description: Source matching configuration
          additionalProperties: true
        destination:
          type: object
          description: Destination matching configuration
          additionalProperties: true
        schedule:
          type: object
          description: Schedule configuration
          additionalProperties: true

    FirewallPolicyInput:
      type: object
      required:
        - action
        - enabled
        - name
      properties:
        action:
          type: string
          description: Action to take when traffic matches this policy
          enum:
            - ALLOW
            - DROP
            - REJECT
          example: ALLOW
        enabled:
          type: boolean
          description: Whether the policy is enabled
          example: true
        name:
          type: string
          description: Name of the firewall policy
          example: My Custom Policy
        protocol:
          type: string
          description: Protocol to match
          example: all
        logging:
          type: boolean
          description: Whether to log matching traffic
          default: false
          example: false
        ip_version:
          type: string
          description: IP version to match
          enum:
            - IPV4
            - IPV6
            - BOTH
          default: BOTH
          example: BOTH

    # Traffic Rules
    TrafficRule:
      type: object
      required:
        - _id
        - enabled
        - matching_target
      properties:
        _id:
          type: string
          description: Unique identifier for the traffic rule
          example: 507f1f77bcf86cd799439011
        enabled:
          type: boolean
          description: Whether the traffic rule is enabled
          example: true
        description:
          type: string
          description: User-provided description of the rule
          example: Limit streaming bandwidth
        action:
          type: string
          description: Action to apply (e.g., bandwidth limit, block)
          example: BLOCK
        matching_target:
          type: string
          description: What this rule matches against
          enum:
            - CLIENT
            - NETWORK
            - INTERNET
            - REGION
          example: INTERNET
        app_category_ids:
          type: array
          description: List of application category IDs to match
          items:
            type: string
        app_ids:
          type: array
          description: List of application IDs to match
          items:
            type: string
        domains:
          type: array
          description: List of domains to match
          items:
            type: string
        target_devices:
          type: array
          description: Devices affected by this rule
          items:
            type: object
            additionalProperties: true
        bandwidth_limit:
          type: object
          description: Bandwidth limiting configuration
          additionalProperties: true
        schedule:
          type: object
          description: Schedule configuration
          additionalProperties: true

    TrafficRuleInput:
      type: object
      required:
        - enabled
        - matching_target
      properties:
        enabled:
          type: boolean
          description: Whether the traffic rule is enabled
          example: true
        description:
          type: string
          description: User-provided description of the rule
          example: Limit streaming bandwidth
        action:
          type: string
          description: Action to apply
          example: BANDWIDTH_LIMIT
        matching_target:
          type: string
          description: What this rule matches against
          enum:
            - CLIENT
            - NETWORK
            - INTERNET
            - REGION
          example: INTERNET

    # Analytics / Dashboard
    AggregatedDashboard:
      type: object
      description: Aggregated dashboard statistics and analytics
      properties:
        dashboard_meta:
          type: object
          description: Metadata about the dashboard view
          properties:
            start_timestamp:
              type: integer
              description: Start of time range (Unix timestamp ms)
              example: 1762797600000
            end_timestamp:
              type: integer
              description: End of time range (Unix timestamp ms)
              example: 1762881470751
            layout:
              type: string
              description: Dashboard layout type
              example: gateway
            widgets:
              type: array
              description: List of enabled widgets
              items:
                type: string
              example:
                - traffic_identification
                - wifi_technology
                - most_active_clients
        most_active_clients:
          type: object
          description: Most active clients statistics
          properties:
            total_bytes:
              type: integer
              description: Total bytes across all clients
              example: 1070333306
            usage_by_client:
              type: array
              description: Per-client usage statistics
              items:
                type: object
                additionalProperties: true
        wifi_channels:
          type: object
          description: WiFi channel usage information
          properties:
            radio_channels:
              type: array
              description: Channel information per radio
              items:
                type: object
                additionalProperties: true
        wifi_technology:
          type: object
          description: WiFi technology distribution (WiFi 4/5/6/6E)
          properties:
            summary:
              type: array
              description: Technology usage summary
              items:
                type: object
                additionalProperties: true
        most_active_aps:
          type: object
          description: Most active access points
          properties:
            total_bytes:
              type: integer
              description: Total bytes across all APs
              example: 78641476726
            usage_by_ap:
              type: array
              description: Per-AP usage statistics
              items:
                type: object
                additionalProperties: true
        internet:
          type: object
          description: Internet connectivity health
          properties:
            health_history:
              type: array
              description: Historical health data points
              items:
                type: object
                properties:
                  timestamp:
                    type: integer
                    description: Unix timestamp (ms)
                  wan_downtime:
                    type: boolean
                    description: Whether WAN was down
                  high_latency:
                    type: boolean
                    description: Whether latency was high
                  packet_loss:
                    type: boolean
                    description: Whether packet loss occurred

    # V2 API - Active Client
    ActiveClient:
      type: object
      description: Active client with full connection details
      properties:
        id:
          type: string
          description: Client identifier (usually MAC)
          example: "00:11:22:33:44:55"
        mac:
          type: string
          description: MAC address
          example: "00:11:22:33:44:55"
        ip:
          type: string
          description: IP address
          example: "192.168.1.100"
        hostname:
          type: string
          description: Client hostname
          example: client-device
        display_name:
          type: string
          description: Display name
          example: "Client Device"
        oui:
          type: string
          description: Manufacturer from OUI lookup
          example: "Example Manufacturer Inc."
        type:
          type: string
          description: Connection type
          enum:
            - WIRED
            - WIRELESS
          example: WIRELESS
        is_wired:
          type: boolean
          description: Whether client is wired
          example: false
        is_guest:
          type: boolean
          description: Whether client is on guest network
          example: false
        status:
          type: string
          description: Client status
          enum:
            - online
            - offline
          example: online
        blocked:
          type: boolean
          description: Whether client is blocked
          example: false
        network_id:
          type: string
          description: Network ID
          example: "507f1f77bcf86cd799439011"
        network_name:
          type: string
          description: Network name
          example: Default
        site_id:
          type: string
          description: Site ID
          example: "507f1f77bcf86cd799439012"
        first_seen:
          type: integer
          description: Unix timestamp when first seen
          example: 1700000000
        last_seen:
          type: integer
          description: Unix timestamp when last seen
          example: 1700086400
        uptime:
          type: integer
          description: Connection uptime in seconds
          example: 3600
        ap_mac:
          type: string
          description: Connected AP MAC address
          example: "00:11:22:33:44:66"
        essid:
          type: string
          description: SSID name
          example: "MyNetwork"
        channel:
          type: integer
          description: WiFi channel
          example: 6
        radio:
          type: string
          description: Radio band
          enum:
            - ng
            - na
            - 6e
          example: ng
        signal:
          type: integer
          description: Signal strength in dBm
          example: -65
        rssi:
          type: integer
          description: RSSI value
          example: 35
        noise:
          type: integer
          description: Noise floor in dBm
          example: -95
        rx_bytes:
          type: integer
          description: Total received bytes
          example: 1048576
        tx_bytes:
          type: integer
          description: Total transmitted bytes
          example: 524288
        rx_rate:
          type: integer
          description: Current RX rate in bps
          example: 144400
        tx_rate:
          type: integer
          description: Current TX rate in bps
          example: 144400

    # V2 API - All Devices Response
    AllDevicesResponse:
      type: object
      description: Response containing devices grouped by UniFi application
      properties:
        network_devices:
          type: array
          description: Network devices (switches, APs, gateways)
          items:
            $ref: '#/components/schemas/NetworkDevice'
        protect_devices:
          type: array
          description: Protect cameras and NVRs
          items:
            type: object
            additionalProperties: true
        access_devices:
          type: array
          description: Access control devices
          items:
            type: object
            additionalProperties: true
        talk_devices:
          type: array
          description: Talk/intercom devices
          items:
            type: object
            additionalProperties: true
        connect_devices:
          type: array
          description: Connect EV chargers
          items:
            type: object
            additionalProperties: true

    NetworkDevice:
      type: object
      description: A network device with full details from v2 API
      properties:
        _id:
          type: string
          description: Internal MongoDB ID
          example: 6807e7c7a17d11646def67fb
        mac:
          type: string
          description: MAC address
          example: "70:a7:41:c1:85:75"
        ip:
          type: string
          description: IP address
          example: "192.168.1.10"
        name:
          type: string
          description: Device name
          example: USW Flex Mini
        model:
          type: string
          description: Model identifier
          example: USMINI
        type:
          type: string
          description: Device type
          enum:
            - uap
            - usw
            - ugw
            - udm
            - uxg
          example: usw
        version:
          type: string
          description: Firmware version
          example: "2.1.6.762"
        adopted:
          type: boolean
          description: Whether device is adopted
          example: true
        state:
          type: integer
          description: Device state (1=connected, 0=disconnected)
          example: 1
        uptime:
          type: integer
          description: Uptime in seconds
          example: 114336
        last_seen:
          type: integer
          description: Unix timestamp of last communication
          example: 1764038001
        upgradable:
          type: boolean
          description: Whether firmware upgrade is available
          example: false
        num_sta:
          type: integer
          description: Number of connected stations/clients
          example: 4
        satisfaction:
          type: integer
          description: Experience score (-1 if N/A)
          example: -1
        is_access_point:
          type: boolean
          description: Whether device is an access point
          example: false
        port_table:
          type: array
          description: Port status and statistics
          items:
            $ref: '#/components/schemas/NetworkDevicePort'
        uplink:
          $ref: '#/components/schemas/NetworkDeviceUplink'

    NetworkDevicePort:
      type: object
      properties:
        port_idx:
          type: integer
          description: Port index (1-based)
          example: 1
        media:
          type: string
          description: Port media type
          example: GE
        speed:
          type: integer
          description: Current speed in Mbps
          example: 1000
        up:
          type: boolean
          description: Whether port is up
          example: true
        full_duplex:
          type: boolean
          description: Full duplex mode
          example: true
        is_uplink:
          type: boolean
          description: Whether this is an uplink port
          example: true
        rx_bytes:
          type: integer
          description: Total received bytes
          example: 373591446254
        tx_bytes:
          type: integer
          description: Total transmitted bytes
          example: 175115371738

    NetworkDeviceUplink:
      type: object
      description: Uplink connection information
      properties:
        type:
          type: string
          description: Uplink type
          enum:
            - wire
            - wireless
          example: wire
        name:
          type: string
          description: Interface name
          example: eth0
        mac:
          type: string
          description: Device MAC
          example: "70:a7:41:c1:85:75"
        uplink_mac:
          type: string
          description: Uplink device MAC
          example: "94:2a:6f:ce:26:52"
        uplink_device_name:
          type: string
          description: Uplink device name
          example: Main Router
        speed:
          type: integer
          description: Link speed in Mbps
          example: 1000

    # V2 API - Topology
    Topology:
      type: object
      description: Network topology graph
      properties:
        vertices:
          type: array
          description: Network nodes (devices and clients)
          items:
            $ref: '#/components/schemas/TopologyVertex'
        edges:
          type: array
          description: Connections between nodes
          items:
            $ref: '#/components/schemas/TopologyEdge'

    TopologyVertex:
      type: object
      description: A node in the network topology
      properties:
        mac:
          type: string
          description: MAC address
          example: "00:11:22:33:44:55"
        name:
          type: string
          description: Node display name
          example: "Server 01"
        type:
          type: string
          description: Node type
          enum:
            - CLIENT
            - NETWORK_DEVICE
          example: CLIENT
        unifiDevice:
          type: boolean
          description: Whether this is a UniFi device
          example: false
        allowedInVisualProgramming:
          type: boolean
          description: Whether allowed in visual programming
          example: false

    TopologyEdge:
      type: object
      description: A connection between two nodes
      properties:
        uplinkMac:
          type: string
          description: Uplink device MAC address
          example: "00:11:22:33:44:55"
        downlinkMac:
          type: string
          description: Downlink device/client MAC address
          example: "00:11:22:33:44:66"
        type:
          type: string
          description: Connection type
          enum:
            - WIRED
            - WIRELESS
          example: WIRED
        networkId:
          type: string
          description: Network ID
          example: "507f1f77bcf86cd799439011"
        channel:
          type: integer
          description: WiFi channel (for wireless connections)
          example: 6
        essid:
          type: string
          description: SSID name (for wireless connections)
          example: "MyNetwork"
        radioBand:
          type: string
          description: Radio band (ng=2.4GHz, na=5GHz, 6e=6GHz)
          example: ng
        protocol:
          type: string
          description: WiFi protocol (g, n, ac, ax, etc.)
          example: ax
        experienceScore:
          type: integer
          description: Connection experience score (0-100)
          example: 95
        rateMbps:
          type: integer
          description: Connection rate in Mbps (for wired)
          example: 1000
        duplex:
          type: string
          description: Duplex mode (for wired)
          enum:
            - FULL_DUPLEX
            - HALF_DUPLEX
          example: FULL_DUPLEX
        uplinkPortNumber:
          type: integer
          description: Uplink port number (for wired)
          example: 1
        downlinkPortNumber:
          type: integer
          description: Downlink port number (for wired)
          example: 1

    # Firewall Zones
    FirewallZone:
      type: object
      description: A firewall zone grouping networks
      required:
        - _id
        - name
        - zone_key
      properties:
        _id:
          type: string
          description: Unique identifier
          example: "68a496708e604379be63f813"
        name:
          type: string
          description: Zone display name
          example: Internal
        zone_key:
          type: string
          description: Zone key identifier
          enum:
            - internal
            - external
            - gateway
            - vpn
            - hotspot
            - dmz
          example: internal
        default_zone:
          type: boolean
          description: Whether this is a default system zone
          example: true
        attr_no_edit:
          type: boolean
          description: Whether zone attributes cannot be edited
          example: false
        network_ids:
          type: array
          description: Network IDs associated with this zone
          items:
            type: string
          example:
            - "66c784195302e23512334eb4"

    FirewallZoneMatrixEntry:
      type: object
      description: Zone-to-zone policy matrix entry
      required:
        - _id
        - name
        - zone_key
        - data
      properties:
        _id:
          type: string
          description: Source zone ID
          example: "68a496708e604379be63f813"
        name:
          type: string
          description: Source zone name
          example: Internal
        zone_key:
          type: string
          description: Source zone key
          example: internal
        data:
          type: array
          description: Policy data for each destination zone
          items:
            $ref: '#/components/schemas/ZoneMatrixData'

    ZoneMatrixData:
      type: object
      description: Policy data between two zones
      properties:
        _id:
          type: string
          description: Destination zone ID
          example: "68a496708e604379be63f814"
        action:
          type: string
          description: Default action between zones
          nullable: true
          enum:
            - allow_all
            - block_all
            - return_traffic
          example: allow_all
        policy_count:
          type: integer
          description: Number of policies between zones
          example: 1

    # Speedtest
    SpeedtestLatest:
      type: object
      description: Latest speedtest results and schedule
      properties:
        cron_schedule:
          type: string
          description: Cron expression for automatic speedtests
          example: "0 5 * * *"
        latest:
          $ref: '#/components/schemas/SpeedtestResult'

    SpeedtestResult:
      type: object
      description: Single speedtest result
      properties:
        id:
          type: string
          description: Speedtest ID

          type: string
          description: Network configuration ID
          example: "66c784195302e23512334eb3"
        time:
          type: integer
          format: int64
          description: Test timestamp in Unix milliseconds
          example: 1764039581000
        download_mbps:
          type: integer
          description: Download speed in Mbps
          example: 884
        upload_mbps:
          type: integer
          description: Upload speed in Mbps
          example: 847
        latency_ms:
          type: integer
          description: Latency in ms
          example: 5

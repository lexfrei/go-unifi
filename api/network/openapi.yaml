            - disconnected
            - connecting
        remote_ip:
          type: string
          description: Remote IP address
        local_ip:
          type: string
          description: Local IP address
        uptime:
          type: integer
          description: Connection uptime in seconds

    # Traffic Routes
    TrafficRoute:

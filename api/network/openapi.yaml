            type: string
        ip_addresses:
          type: array
          description: Target IP addresses (for IP matching)
          items:
            type: string
        ip_ranges:
          type: array
          description: Target IP ranges (for IP matching)
          items:
            type: string
        regions:
          type: array
          description: Target regions (for REGION matching)
          items:
            type: string
        target_device:
          type: string
          description: Target device/interface
          enum:
